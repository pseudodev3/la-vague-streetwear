<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Error Tracking (Sentry) -->
    <script src="src/config/sentry-env.js"></script>
    <script src="src/config/sentry-browser.js" async></script>
    <link rel="icon" href="/la-vague-red-wordmark.png" type="image/png">
    <link rel="apple-touch-icon" href="/la-vague-red-wordmark.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | LA VAGUE Streetwear</title>
    <meta name="description" content="Thank you for your order from LA VAGUE.">
    <meta name="robots" content="noindex, nofollow, noarchive">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="src/styles/fonts.css?v=9.0">
    
    <link rel="stylesheet" href="src/styles/styles.css?v=9.0">
    <link rel="stylesheet" href="src/styles/page-styles.css?v=9.0">
    <link rel="stylesheet" href="src/styles/storefront-system.css?v=10.0">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav" id="nav"></nav>

    <!-- Confirmation -->
    <main class="confirmation">
        <section class="confirmation-card" id="confirmationCard" aria-live="polite">
            <div class="confirmation-mark" aria-hidden="true">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12.5 9.2 17 19 7"></path>
                </svg>
            </div>
            <p class="confirmation-kicker" id="confirmationStatus">Order confirmed</p>
            <h1 id="confirmationTitle">You're all set.</h1>
            <p class="confirmation-message" id="confirmationMessage">Your order is confirmed. We will send delivery updates using the contact details provided at checkout.</p>

            <div class="order-details">
                <span class="order-detail-label">Order reference</span>
                <strong class="order-number">#<span id="orderNumber"></span></strong>
                <span class="order-email">Keep this reference if you need support.</span>
            </div>

            <div class="confirmation-actions">
                <a href="/track-order" class="btn btn-secondary">Track order</a>
                <a href="/shop" class="btn btn-primary">Continue shopping</a>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer"></footer>

    <!-- Universal UI Components (Injected by components.js) -->
    <div id="searchOverlay" class="search-overlay"></div>
    <div id="cartOverlay" class="cart-overlay"></div>
    <div id="cartSidebar" class="cart-sidebar"></div>
    <div id="wishlistOverlay" class="wishlist-overlay"></div>
    <div id="wishlistSidebar" class="wishlist-sidebar"></div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="src/scripts/cart.js?v=9.0"></script>
    <script src="src/scripts/components.js?v=9.0"></script>
    <script src="src/scripts/search.js?v=1.0"></script>
    <script src="src/scripts/utils.js?v=9.0"></script>
    <script src="src/scripts/page.js?v=9.0"></script>
    <script src="src/scripts/order-confirmation.js?v=9.0"></script>
    <script src="src/scripts/cookie-consent.js?v=9.0"></script>
    <script src="src/scripts/pwa-register.js?v=1.0"></script>
</body>
</html>
