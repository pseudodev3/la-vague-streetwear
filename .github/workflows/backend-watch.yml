name: Backend Watch

on:
  workflow_dispatch:
  schedule:
    # Offset from the top of the hour to reduce GitHub scheduler congestion.
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    paths:
      - '.github/workflows/backend-watch.yml'
      - 'render.yaml'
      - 'docs/DEPLOYMENT.md'
      - 'README.md'
      - '.env.example'
      - 'server.js'

permissions:
  contents: read

concurrency:
  group: backend-watch
  cancel-in-progress: true

jobs:
  probe:
    name: Probe Render API
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check liveness and Aiven readiness
        env:
          BASE_URL: https://la-vague-api.onrender.com
        shell: bash
        run: |
          set -euo pipefail

          started_at=$(date +%s)
          read -r health_status health_time < <(curl --silent --show-error --retry 2 --retry-all-errors --retry-delay 3 --retry-max-time 65 --connect-timeout 10 --max-time 60 --output /tmp/la-vague-health.json --write-out '%{http_code} %{time_total}\n' "$BASE_URL/api/health")
          elapsed=$(( $(date +%s) - started_at ))

          if [[ "$health_status" -lt 200 || "$health_status" -ge 300 ]]; then
            echo "Liveness failed: HTTP $health_status after ${health_time}s" >&2
            cat /tmp/la-vague-health.json >&2 || true
            exit 1
          fi

          HEALTH_ELAPSED="$elapsed" python3 - <<'PY'
          import json
          import os
          import sys

          with open('/tmp/la-vague-health.json', encoding='utf-8') as handle:
              health = json.load(handle)

          status = health.get('status')
          uptime = int(health.get('uptimeSeconds', -1))
          elapsed = int(os.environ['HEALTH_ELAPSED'])

          if status != 'ok' or uptime < 0:
              print(f'Invalid liveness payload: {health}', file=sys.stderr)
              raise SystemExit(1)

          if elapsed >= 8 and uptime <= 180:
              signature = 'cold-start / wake-up signature'
          elif uptime <= 180:
              signature = 'recent process start/restart signature'
          else:
              signature = 'already warm'

          print(f'Liveness: ok | response={elapsed}s | uptimeSeconds={uptime} | {signature}')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('## Backend watch\n\n')
                  handle.write(f'- Liveness response: **{elapsed}s**\n')
                  handle.write(f'- Process uptime: **{uptime}s**\n')
                  handle.write(f'- Runtime signature: **{signature}**\n')
          PY

          read -r ready_status ready_time < <(curl --silent --show-error --retry 1 --retry-all-errors --retry-delay 3 --retry-max-time 30 --connect-timeout 10 --max-time 20 --output /tmp/la-vague-ready.json --write-out '%{http_code} %{time_total}\n' "$BASE_URL/api/ready")

          if [[ "$ready_status" -lt 200 || "$ready_status" -ge 300 ]]; then
            echo "Readiness failed: HTTP $ready_status after ${ready_time}s" >&2
            cat /tmp/la-vague-ready.json >&2 || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          import sys

          with open('/tmp/la-vague-ready.json', encoding='utf-8') as handle:
              ready = json.load(handle)

          if ready.get('status') != 'ready' or ready.get('database') != 'reachable':
              print(f'Invalid readiness payload: {ready}', file=sys.stderr)
              raise SystemExit(1)

          print('Readiness: ready | Aiven PostgreSQL reachable')

          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as handle:
                  handle.write('- Aiven readiness: **reachable**\n')
          PY
