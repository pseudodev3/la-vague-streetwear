name: One-time Remove Unused Sentry Profiling

on:
  push:
    branches: [redesign/admin-storefront-2026]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/admin-storefront-2026
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Remove unused native profiling dependency
        run: npm uninstall @sentry/profiling-node --package-lock-only --ignore-scripts

      - name: Validate deterministic install
        run: npm ci

      - name: Validate app
        run: |
          npm run lint
          npm run type-check
          npm run test:ci
          npm run build
          npm audit --audit-level=moderate

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-remove-sentry-profiling.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/one-time-remove-sentry-profiling.yml
          git commit -m "refactor: remove unused Sentry profiling dependency"
          git push origin HEAD:redesign/admin-storefront-2026
