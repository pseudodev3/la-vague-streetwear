name: One-time Search Placeholder Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Remove broken search placeholder translation key
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');

          const componentsPath = 'src/scripts/components.js';
          let components = fs.readFileSync(componentsPath, 'utf8');
          components = components.replace(
            ' placeholder="Search products..." autocomplete="off" data-i18n-placeholder="search.placeholder"',
            ' placeholder="Search products..." autocomplete="off"'
          );
          fs.writeFileSync(componentsPath, components);

          const i18nPath = 'src/scripts/i18n.js';
          let i18n = fs.readFileSync(i18nPath, 'utf8');
          const block = `        // Update search placeholder\n        const searchInput = document.getElementById('searchInput');\n        if (searchInput) {\n            searchInput.placeholder = this.getTranslation('search.placeholder');\n        }\n        \n`;
          if (!i18n.includes(block)) throw new Error('Expected search placeholder block not found');
          i18n = i18n.replace(block, '');
          fs.writeFileSync(i18nPath, i18n);
          NODE

          if grep -R "search\.placeholder" src/scripts --exclude-dir=node_modules; then
            echo "search.placeholder still exists"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run type-check
          npm run test:ci
          npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-search-placeholder-fix.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/scripts/components.js src/scripts/i18n.js .github/workflows/one-time-search-placeholder-fix.yml
          git commit -m "fix: keep search placeholder human-readable"
          git push origin HEAD:main