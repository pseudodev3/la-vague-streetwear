name: One-time Storefront Live Data Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Apply storefront cleanup
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          function replaceOrThrow(file, from, to, label) {
            const before = fs.readFileSync(file, 'utf8');
            if (!before.includes(from)) throw new Error(`Missing expected ${label} in ${file}`);
            fs.writeFileSync(file, before.replace(from, to));
          }

          // 1) Remove generic stock photos from Shipping / Returns CTAs.
          for (const file of ['shipping.html', 'returns.html']) {
            let html = fs.readFileSync(file, 'utf8');
            html = html.replace(/<div class="page-contact-cta">\s*<img[^>]+class="cta-image"[^>]*>/, '<div class="page-contact-cta no-image">');
            fs.writeFileSync(file, html);
          }

          // 2) Remove static product fallback from Shop.
          replaceOrThrow(
            'src/scripts/shop.js',
            "console.warn('API unavailable, using static data');",
            "console.warn('API unavailable; live products cannot be loaded');",
            'shop API warning'
          );

          replaceOrThrow(
            'src/scripts/shop.js',
            `    if (apiProducts && apiProducts.length > 0) {\n        state.products = apiProducts.map(transformProduct);\n        state.usingStaticData = false;\n    } else {\n        state.products = ProductAPI.getAll();\n        state.usingStaticData = true;\n    }`,
            `    if (Array.isArray(apiProducts)) {\n        state.products = apiProducts.map(transformProduct);\n        state.usingStaticData = false;\n    } else {\n        state.products = [];\n        state.usingStaticData = false;\n        if (elements.emptyState) {\n            elements.emptyState.innerHTML = '<h3>Store temporarily unavailable</h3><p>We could not load live products right now. Please refresh in a moment.</p>';\n        }\n    }`,
            'shop static fallback block'
          );

          replaceOrThrow(
            'src/scripts/shop.js',
            "return { available: 999, inStock: true }; // Default to available on error",
            "return { available: 0, inStock: false, unavailable: true };",
            'shop stock fail-open fallback'
          );

          // 3) Remove static featured/search fallback from homepage.
          replaceOrThrow(
            'src/scripts/home.js',
            "console.warn('API unavailable, using static data');",
            "console.warn('API unavailable; live products cannot be loaded');",
            'home API warning'
          );

          replaceOrThrow(
            'src/scripts/home.js',
            `    // Fallback to static data if API fails or no bestsellers found\n    if (featured.length === 0) {\n        featured = ProductAPI.getFeatured().slice(0, 4);\n    }`,
            `    if (apiProducts === null) {\n        elements.featuredProducts.innerHTML = '<div class="store-unavailable-state"><h3>Store temporarily unavailable</h3><p>We could not load live products right now. Please refresh in a moment.</p></div>';\n        return;\n    }\n\n    // If no products are explicitly tagged as bestsellers, use live API products only.\n    if (featured.length === 0 && apiProducts.length > 0) {\n        featured = apiProducts.map(transformProduct).slice(0, 4);\n    }\n\n    if (featured.length === 0) {\n        elements.featuredProducts.innerHTML = '<div class="store-unavailable-state"><p>No products are available right now.</p></div>';\n        return;\n    }`,
            'home static fallback block'
          );

          // Replace homepage static search with live API search cache.
          const home = fs.readFileSync('src/scripts/home.js', 'utf8');
          const searchStart = home.indexOf('function handleSearch(query) {');
          const searchEnd = home.indexOf('\n// ==========================================\n// LIGHTBOX', searchStart);
          if (searchStart === -1 || searchEnd === -1) throw new Error('Could not locate homepage search block');
          const liveSearch = `let liveSearchProducts = null;\nlet liveSearchPromise = null;\n\nasync function getLiveSearchProducts() {\n    if (liveSearchProducts) return liveSearchProducts;\n    if (!liveSearchPromise) {\n        liveSearchPromise = HomeAPI.getProducts().then(products => {\n            liveSearchProducts = Array.isArray(products) ? products.map(transformProduct) : null;\n            return liveSearchProducts;\n        });\n    }\n    return liveSearchPromise;\n}\n\nasync function handleSearch(query) {\n    const normalized = query.trim().toLowerCase();\n    if (!normalized) {\n        if (elements.searchResults) elements.searchResults.innerHTML = '';\n        return;\n    }\n\n    const products = await getLiveSearchProducts();\n    if (!products) {\n        elements.searchResults.innerHTML = '<div class="search-message">Search is temporarily unavailable. Please try again shortly.</div>';\n        return;\n    }\n\n    const results = products.filter(product => {\n        const tags = Array.isArray(product.tags) ? product.tags.join(' ') : '';\n        return [product.name, product.category, tags].join(' ').toLowerCase().includes(normalized);\n    }).slice(0, 8);\n\n    if (results.length === 0) {\n        elements.searchResults.innerHTML = '<div class="search-message">No products found.</div>';\n        return;\n    }\n\n    elements.searchResults.innerHTML = results.map(product => {\n        const image = product.images?.[0]?.src || '';\n        const category = CATEGORIES.find(c => c.id === product.category)?.name || product.category || '';\n        return \`\n            <div class="search-result-item" onclick="window.location.href='product.html?slug=\${encodeURIComponent(product.slug)}'">\n                <img src="\${image}" alt="\${product.name}">\n                <div class="search-result-info">\n                    <h4>\${product.name}</h4>\n                    <p>\${category}</p>\n                </div>\n                <span class="search-result-price">\${CurrencyConfig.formatPrice(product.price)}</span>\n            </div>\n        \`;\n    }).join('');\n}\n`;
          fs.writeFileSync('src/scripts/home.js', home.slice(0, searchStart) + liveSearch + home.slice(searchEnd));

          // 4) Shared live search for pages that do not own their own search implementation.
          const searchScript = `/**\n * LA VAGUE - Shared live product search for content/product pages.\n * Homepage and Shop keep their page-specific implementations.\n */\n(() => {\n    let products = null;\n    let productsPromise = null;\n    let bound = false;\n\n    const escapeHtml = value => String(value ?? '')\n        .replaceAll('&', '&amp;')\n        .replaceAll('<', '&lt;')\n        .replaceAll('>', '&gt;')\n        .replaceAll('"', '&quot;')\n        .replaceAll("'", '&#039;');\n\n    const formatPrice = value => window.CurrencyConfig?.formatPrice\n        ? window.CurrencyConfig.formatPrice(value)\n        : \`₦\${Number(value || 0).toLocaleString()}\`;\n\n    async function loadProducts() {\n        if (products) return products;\n        if (!productsPromise) {\n            productsPromise = fetch('/api/products')\n                .then(response => {\n                    if (!response.ok) throw new Error('Products unavailable');\n                    return response.json();\n                })\n                .then(data => {\n                    products = Array.isArray(data.products) ? data.products : [];\n                    return products;\n                })\n                .catch(error => {\n                    console.warn('[SEARCH] Live products unavailable:', error.message);\n                    return null;\n                });\n        }\n        return productsPromise;\n    }\n\n    function bind() {\n        if (bound) return;\n        const overlay = document.getElementById('searchOverlay');\n        const button = document.getElementById('searchBtn');\n        const close = document.getElementById('searchClose');\n        const input = document.getElementById('searchInput');\n        const results = document.getElementById('searchResults');\n        if (!overlay || !button || !close || !input || !results) return;\n        bound = true;\n\n        const closeSearch = () => {\n            overlay.classList.remove('active');\n            input.value = '';\n            results.innerHTML = '';\n            document.body.style.overflow = '';\n        };\n\n        button.addEventListener('click', async () => {\n            overlay.classList.add('active');\n            document.body.style.overflow = 'hidden';\n            input.focus();\n            await loadProducts();\n        });\n        close.addEventListener('click', closeSearch);\n        overlay.addEventListener('click', event => {\n            if (event.target === overlay) closeSearch();\n        });\n        document.addEventListener('keydown', event => {\n            if (event.key === 'Escape' && overlay.classList.contains('active')) closeSearch();\n        });\n\n        let timer;\n        input.addEventListener('input', () => {\n            clearTimeout(timer);\n            timer = setTimeout(async () => {\n                const query = input.value.trim().toLowerCase();\n                if (!query) {\n                    results.innerHTML = '';\n                    return;\n                }\n                const liveProducts = await loadProducts();\n                if (!liveProducts) {\n                    results.innerHTML = '<div class="search-message">Search is temporarily unavailable. Please try again shortly.</div>';\n                    return;\n                }\n                const matches = liveProducts.filter(product => {\n                    const tags = Array.isArray(product.tags) ? product.tags.join(' ') : String(product.tags || '');\n                    return [product.name, product.category, tags].join(' ').toLowerCase().includes(query);\n                }).slice(0, 8);\n                if (!matches.length) {\n                    results.innerHTML = '<div class="search-message">No products found.</div>';\n                    return;\n                }\n                results.innerHTML = matches.map(product => {\n                    let images = product.images;\n                    if (typeof images === 'string') {\n                        try { images = JSON.parse(images); } catch { images = []; }\n                    }\n                    const image = images?.[0]?.src || '';\n                    const slug = encodeURIComponent(product.slug || product.id || '');\n                    return \`<a class="search-result-item" href="/product.html?slug=\${slug}">\n                        \${image ? \`<img src="\${escapeHtml(image)}" alt="\${escapeHtml(product.name)}">\` : ''}\n                        <div class="search-result-info">\n                            <h4>\${escapeHtml(product.name)}</h4>\n                            <p>\${escapeHtml(product.category || '')}</p>\n                        </div>\n                        <span class="search-result-price">\${escapeHtml(formatPrice(product.price))}</span>\n                    </a>\`;\n                }).join('');\n            }, 220);\n        });\n    }\n\n    window.addEventListener('componentsLoaded', bind);\n})();\n`;
          fs.writeFileSync('src/scripts/search.js', searchScript);

          // Load shared search on pages without their own search implementation.
          const excluded = new Set(['index.html', 'shop.html', 'admin.html', 'checkout.html']);
          for (const file of fs.readdirSync('.').filter(name => name.endsWith('.html'))) {
            if (excluded.has(file)) continue;
            let html = fs.readFileSync(file, 'utf8');
            if (!html.includes('src/scripts/components.js') || html.includes('src/scripts/search.js')) continue;
            html = html.replace(
                /(<script src="src\/scripts\/components\.js[^>]*><\/script>)/,
                `$1\n    <script src="src/scripts/search.js?v=1.0"></script>`
            );
            fs.writeFileSync(file, html);
          }

          // 5) Shared CSS for no-image CTAs, live search, and unavailable states.
          const cssFile = 'src/styles/storefront-polish.css';
          let css = fs.readFileSync(cssFile, 'utf8');
          const marker = '/* Live storefront states ------------------------------------------------- */';
          if (!css.includes(marker)) {
            css += `\n\n${marker}\n.page-contact-cta.no-image {\n    grid-template-columns: 1fr;\n    min-height: 0;\n}\n\n.page-contact-cta.no-image .cta-content {\n    min-height: 220px;\n    background: linear-gradient(120deg, rgba(220, 38, 38, 0.07), #101010 46%);\n}\n\n.store-unavailable-state,\n.search-message {\n    width: 100%;\n    padding: 2rem;\n    border: 1px solid var(--color-border);\n    background: var(--color-bg-secondary);\n    color: var(--color-text-muted);\n    text-align: center;\n}\n\n.store-unavailable-state h3 {\n    margin-bottom: 0.5rem;\n    color: var(--color-text);\n    font-family: var(--font-heading);\n}\n\n.search-result-item {\n    display: flex;\n    align-items: center;\n    gap: 1rem;\n    width: 100%;\n    padding: 1rem;\n    border-bottom: 1px solid var(--color-border);\n    color: var(--color-text);\n    text-decoration: none;\n    cursor: pointer;\n    transition: background 0.2s ease;\n}\n\n.search-result-item:hover,\n.search-result-item:focus-visible {\n    background: var(--color-bg-secondary);\n}\n\n.search-result-item img {\n    width: 58px;\n    height: 72px;\n    object-fit: cover;\n    background: #111;\n}\n\n.search-result-info {\n    min-width: 0;\n    flex: 1;\n}\n\n.search-result-info h4 {\n    margin: 0 0 0.25rem;\n    overflow: hidden;\n    text-overflow: ellipsis;\n    white-space: nowrap;\n}\n\n.search-result-info p {\n    margin: 0;\n    color: var(--color-text-muted);\n    font-size: 0.8rem;\n    text-transform: capitalize;\n}\n\n.search-result-price {\n    flex: 0 0 auto;\n    font-family: var(--font-heading);\n    font-weight: 600;\n}\n\n@media (max-width: 640px) {\n    .page-contact-cta.no-image .cta-content { min-height: 190px; }\n    .search-result-item { gap: 0.75rem; padding: 0.85rem; }\n    .search-result-item img { width: 50px; height: 64px; }\n    .search-result-price { font-size: 0.85rem; }\n}\n`;
            fs.writeFileSync(cssFile, css);
          }
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npm run lint
          npm run type-check

      - name: Run unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-storefront-live-data-cleanup.yml

      - name: Commit storefront cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use live storefront data and clean policy pages"
          git push origin HEAD:main
