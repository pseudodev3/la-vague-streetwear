name: One-time Admin Entry Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-entry-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Fix logged-out admin bootstrap and login branding
        shell: python
        run: |
          from pathlib import Path

          admin = Path('src/scripts/admin.js')
          text = admin.read_text()
          old = """    if (document.getElementById('settingsSection')) {\n        loadAdminSettings();\n    }"""
          new = """    if (document.getElementById('settingsSection') && sessionStorage.getItem('adminToken')) {\n        loadAdminSettings();\n    }"""
          if old not in text:
              raise SystemExit('admin settings bootstrap block not found')
          admin.write_text(text.replace(old, new, 1))

          css = Path('src/styles/admin-responsive.css')
          styles = css.read_text()

          old_bg = """body .login-screen {\n    position: relative;\n    min-height: 100svh;\n    padding: clamp(1rem, 4vw, 3rem);\n    background:\n        radial-gradient(circle at 15% 15%, rgba(220, 38, 38, .16), transparent 32%),\n        radial-gradient(circle at 85% 85%, rgba(255, 255, 255, .05), transparent 30%),\n        linear-gradient(160deg, #0a0a0a 0%, #111 48%, #080808 100%);\n}\n\nbody .login-screen::before {\n    content: '';\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    background-image:\n        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),\n        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);\n    background-size: 34px 34px;\n    mask-image: linear-gradient(to bottom, #000, transparent 85%);\n}"""

          new_bg = """body .login-screen {\n    position: relative;\n    min-height: 100svh;\n    padding: clamp(1rem, 4vw, 3rem);\n    overflow: hidden;\n    background:\n        radial-gradient(ellipse at 8% 12%, rgba(230, 35, 38, .17) 0%, rgba(230, 35, 38, .055) 27%, transparent 52%),\n        radial-gradient(ellipse at 88% 78%, rgba(255, 255, 255, .035) 0%, transparent 38%),\n        linear-gradient(145deg, #080808 0%, #0c0c0d 48%, #111113 100%);\n}\n\nbody .login-screen::before {\n    content: '';\n    position: absolute;\n    inset: -20%;\n    pointer-events: none;\n    background:\n        radial-gradient(circle at 38% 44%, rgba(255,255,255,.035), transparent 24%),\n        radial-gradient(circle at 68% 34%, rgba(230,35,38,.055), transparent 21%);\n    filter: blur(32px);\n    opacity: .85;\n}\n\nbody .login-screen::after {\n    content: '';\n    position: absolute;\n    inset: 0;\n    pointer-events: none;\n    background: linear-gradient(180deg, rgba(255,255,255,.018), transparent 24%, rgba(0,0,0,.18));\n}"""

          if old_bg not in styles:
              raise SystemExit('old login background block not found')
          styles = styles.replace(old_bg, new_bg, 1)

          old_box = """    background: rgba(18,18,18,.92);\n    box-shadow: 0 24px 80px rgba(0,0,0,.48);\n    backdrop-filter: blur(18px);"""
          new_box = """    background: linear-gradient(180deg, rgba(20,20,21,.965), rgba(12,12,13,.965));\n    box-shadow: 0 26px 90px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.035);\n    backdrop-filter: blur(22px);"""
          if old_box not in styles:
              raise SystemExit('login box styling block not found')
          css.write_text(styles.replace(old_box, new_box, 1))

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run type-check
          npm run test:ci
          npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/admin-entry-cleanup.yml

      - name: Commit fixes
        run: |
          git config user.name "ghostt"
          git config user.email "63957220+pseudodev3@users.noreply.github.com"
          git add src/scripts/admin.js src/styles/admin-responsive.css .github/workflows/admin-entry-cleanup.yml
          git commit -m "fix: clean admin login entry state"
          git push origin main
