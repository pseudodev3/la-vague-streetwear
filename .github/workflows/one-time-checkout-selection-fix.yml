name: One-time Checkout Selection Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm
      - name: Add clear checkout selection states
        shell: bash
        run: |
          cat >> src/styles/checkout-styles.css <<'EOF'

/* Clear checkout selection controls */
.checkbox-label input[type="checkbox"],
.shipping-option input[type="radio"],
.payment-method input[type="radio"] {
    appearance: none;
    -webkit-appearance: none;
    flex: 0 0 auto;
    width: 22px;
    height: 22px;
    border: 2px solid var(--color-text-muted);
    background: transparent;
    display: grid;
    place-items: center;
    cursor: pointer;
}

.checkbox-label input[type="checkbox"] { border-radius: 3px; }
.shipping-option input[type="radio"],
.payment-method input[type="radio"] { border-radius: 50%; }

.checkbox-label input[type="checkbox"]::after,
.shipping-option input[type="radio"]::after,
.payment-method input[type="radio"]::after {
    content: '✓';
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    line-height: 1;
    transform: scale(0);
}

.checkbox-label input[type="checkbox"]:checked,
.shipping-option input[type="radio"]:checked,
.payment-method input[type="radio"]:checked {
    border-color: var(--color-accent);
    background: var(--color-accent);
}

.checkbox-label input[type="checkbox"]:checked::after,
.shipping-option input[type="radio"]:checked::after,
.payment-method input[type="radio"]:checked::after { transform: scale(1); }

.checkbox-label input[type="checkbox"]:focus-visible,
.shipping-option input[type="radio"]:focus-visible,
.payment-method input[type="radio"]:focus-visible {
    outline: 2px solid var(--color-accent);
    outline-offset: 3px;
}

.shipping-option:has(input:checked),
.payment-method:has(input:checked) {
    border-color: var(--color-accent);
    box-shadow: inset 3px 0 0 var(--color-accent);
}

@media (max-width: 768px) {
    .checkbox-label input[type="checkbox"],
    .shipping-option input[type="radio"],
    .payment-method input[type="radio"] {
        width: 24px;
        height: 24px;
    }
}
EOF
      - run: npm ci
      - run: npm run lint && npm run type-check
      - run: npm run test:ci
      - run: npm run build
      - name: Commit
        run: |
          rm .github/workflows/one-time-checkout-selection-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/checkout-styles.css .github/workflows/one-time-checkout-selection-fix.yml
          git commit -m "fix: make checkout selections obvious"
          git push origin HEAD:main
