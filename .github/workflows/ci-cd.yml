name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.20.2'

jobs:
  validate:
    name: CI/CD Pipeline
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Unit tests
        run: npm run test:ci
      - name: Build frontend
        run: npm run build
      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true

  deploy-render:
    name: Deploy to Render
    runs-on: ubuntu-24.04
    needs: [validate, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            curl --fail --show-error --silent -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deploy triggered on Render"
          else
            echo "RENDER_DEPLOY_HOOK not set, skipping deployment"
          fi

  test-e2e:
    name: E2E Tests
    # Playwright's pinned browser/system dependencies support Ubuntu 24.04.
    # ubuntu-latest can move to a newer, unsupported distribution.
    runs-on: ubuntu-24.04
    needs: [validate]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run local E2E tests
        env:
          NODE_ENV: development
          EMAIL_TEST_MODE: 'true'
        run: npm run test:e2e
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
