name: One-time Lookbook Thumbnails

on:
  push:
    branches: [polish/lookbook-seo-cleanup]

permissions:
  contents: write

jobs:
  thumbnails:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: polish/lookbook-seo-cleanup
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate review thumbnails
        run: |
          python -m pip install pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          sources = [
              "assets/urbannights.jpg",
              "assets/daylight.jpg",
              "assets/skatepark.jpg",
              "assets/downtown.jpg",
              "assets/afterhours.jpg",
          ]
          out = Path(".tmp/lookbook-thumbs")
          out.mkdir(parents=True, exist_ok=True)

          for src in sources:
              img = Image.open(src).convert("RGB")
              img.thumbnail((220, 220))
              canvas = Image.new("RGB", (220, 220), "white")
              x = (220 - img.width) // 2
              y = (220 - img.height) // 2
              canvas.paste(img, (x, y))
              canvas.save(out / (Path(src).stem + ".jpg"), quality=48, optimize=True)
          PY

      - name: Commit review thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/lookbook-thumbs
          git commit -m "chore: generate temporary lookbook review thumbnails"
          git push origin HEAD:polish/lookbook-seo-cleanup
