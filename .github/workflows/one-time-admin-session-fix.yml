name: One-time Admin Session Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-admin-session-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Fix remaining admin token storage reads
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/scripts/admin.js')
          text = path.read_text()
          old = "localStorage.getItem('adminToken')"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected exactly 2 legacy adminToken reads, found {count}')
          path.write_text(text.replace(old, "sessionStorage.getItem('adminToken')"))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npm run lint
          npm run type-check

      - name: Run unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-admin-session-fix.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/admin.js .github/workflows/one-time-admin-session-fix.yml
          git commit -m "fix: use session auth consistently in admin actions"
          git push origin HEAD:main
