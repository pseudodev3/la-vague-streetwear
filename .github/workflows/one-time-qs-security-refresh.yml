name: One-time qs Security Refresh

on:
  push:
    branches: [redesign/admin-storefront-2026]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign branch
        uses: actions/checkout@v4
        with:
          ref: redesign/admin-storefront-2026
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Pin patched qs
        run: |
          npm pkg set overrides.qs=6.16.0
          npm install --package-lock-only --ignore-scripts

      - name: Install deterministic dependencies
        run: npm ci

      - name: Validate dependency security
        run: npm audit --audit-level=moderate

      - name: Validate application
        run: |
          npm run lint
          npm run type-check
          npm run test:ci
          npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-qs-security-refresh.yml

      - name: Commit security refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/one-time-qs-security-refresh.yml
          git commit -m "security: pin patched qs dependency"
          git push origin HEAD:redesign/admin-storefront-2026
