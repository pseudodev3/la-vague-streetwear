name: One-time Inventory Visibility Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-inventory-visibility-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Make stock displays reservation-aware
        run: |
          python - <<'PY'
          from pathlib import Path

          # 1) Public stock checks: subtract active PostgreSQL reservations and return a full snapshot.
          products = Path('src/routes/products.js')
          text = products.read_text()
          old = """// Check stock availability (GET)\nrouter.get('/inventory/check/:productId', asyncHandler(async (req, res) => {\n    const { productId } = req.params;\n    const { color, size } = req.query;\n\n    // Support both ID and slug for inventory check\n    const result = await query('SELECT inventory FROM products WHERE id = $1 OR slug = $1', [productId]);\n    if (result.rows.length === 0) throw new APIError('Product not found', 404);\n\n    const inventory = safeParseJSON(result.rows[0].inventory, {});\n    const variantKey = `${color}-${size}`;\n    const available = inventory[variantKey] || 0;\n\n    res.json({ success: true, available, inStock: available > 0 });\n}));\n\n// Check stock availability (POST) - used by checkout-api.js\nrouter.post('/inventory/check', asyncHandler(async (req, res) => {\n    const { productId, color, size } = req.body;\n\n    // Support both ID and slug for inventory check\n    const result = await query('SELECT inventory FROM products WHERE id = $1 OR slug = $1', [productId]);\n    if (result.rows.length === 0) throw new APIError('Product not found', 404);\n\n    const inventory = safeParseJSON(result.rows[0].inventory, {});\n    const variantKey = `${color}-${size}`;\n    const available = inventory[variantKey] || 0;\n\n    res.json({ success: true, available, inStock: available > 0 });\n}));\n"""
          new = """async function getStockSnapshot(productIdOrSlug, color, size) {\n    const result = await query('SELECT id, inventory FROM products WHERE id = $1 OR slug = $1', [productIdOrSlug]);\n    if (result.rows.length === 0) throw new APIError('Product not found', 404);\n\n    const product = result.rows[0];\n    const inventory = safeParseJSON(product.inventory, {});\n    const variantKey = `${color}-${size}`;\n    const total = Number(inventory[variantKey] || 0);\n    let reserved = 0;\n\n    // Production reservations live in PostgreSQL. SQLite reservations are in-memory\n    // inside InventoryService and remain a local-development concern only.\n    if (USE_POSTGRES) {\n        const reservedResult = await query(\n            `SELECT COALESCE(SUM(quantity), 0) AS reserved\n             FROM inventory_reservations\n             WHERE product_id = $1 AND variant_key = $2 AND expires_at > NOW()`,\n            [product.id, variantKey]\n        );\n        reserved = Number(reservedResult.rows[0]?.reserved || 0);\n    }\n\n    const available = Math.max(0, total - reserved);\n    return { total, reserved, available };\n}\n\n// Check stock availability (GET)\nrouter.get('/inventory/check/:productId', asyncHandler(async (req, res) => {\n    const { productId } = req.params;\n    const { color, size } = req.query;\n    const stock = await getStockSnapshot(productId, color, size);\n    res.json({ success: true, ...stock, inStock: stock.available > 0 });\n}));\n\n// Check stock availability (POST)\nrouter.post('/inventory/check', asyncHandler(async (req, res) => {\n    const { productId, color, size } = req.body;\n    const stock = await getStockSnapshot(productId, color, size);\n    res.json({ success: true, ...stock, inStock: stock.available > 0 });\n}));\n"""
          if old not in text:
              raise SystemExit('Could not find expected product stock-check block')
          products.write_text(text.replace(old, new, 1))

          # 2) Low-stock service: base warnings on available stock and expose total/reserved/available.
          inventory = Path('src/services/inventory.js')
          text = inventory.read_text()
          old = """        const lowStock = [];\n        for (const product of products) {\n            const inventory = this.parseInventory(product.inventory);\n            for (const [variantKey, rawQuantity] of Object.entries(inventory)) {\n                const quantity = Number(rawQuantity);\n                if (quantity <= threshold) {\n                    const [color, size] = variantKey.split('-');\n                    lowStock.push({\n                        productId: product.id,\n                        productName: product.name,\n                        variantKey,\n                        color,\n                        size,\n                        quantity,\n                        threshold\n                    });\n                }\n            }\n        }\n\n        return lowStock;\n"""
          new = """        const lowStock = [];\n        for (const product of products) {\n            const inventory = this.parseInventory(product.inventory);\n            for (const [variantKey, rawQuantity] of Object.entries(inventory)) {\n                const total = Number(rawQuantity);\n                const reserved = await this.getReservedCount(product.id, variantKey);\n                const available = Math.max(0, total - reserved);\n\n                if (available <= threshold) {\n                    const separator = variantKey.lastIndexOf('-');\n                    const color = separator >= 0 ? variantKey.slice(0, separator) : variantKey;\n                    const size = separator >= 0 ? variantKey.slice(separator + 1) : '';\n                    lowStock.push({\n                        productId: product.id,\n                        productName: product.name,\n                        variantKey,\n                        color,\n                        size,\n                        quantity: available,\n                        total,\n                        reserved,\n                        available,\n                        threshold\n                    });\n                }\n            }\n        }\n\n        return lowStock;\n"""
          if old not in text:
              raise SystemExit('Could not find expected getLowStock block')
          inventory.write_text(text.replace(old, new, 1))

          # 3) Admin inventory table: use the reservation-aware data it already requests.
          admin = Path('src/scripts/admin.js')
          text = admin.read_text()
          old = """        // Load products and get inventory for each variant\n        const [productsData, lowStockData] = await Promise.all([\n            fetchAPI('/admin/products'),\n            fetchAPI('/admin/inventory/low-stock?threshold=1000') // Get all\n        ]);\n        \n        const products = productsData.products || [];\n        const inventoryList = [];\n        \n        for (const product of products) {\n            const colors = product.colors || [{ name: 'Default' }];\n            const sizes = product.sizes || ['OS'];\n            const inventory = product.inventory || {};\n            \n            for (const color of colors) {\n                for (const size of sizes) {\n                    const variantKey = `${color.name}-${size}`;\n                    const quantity = inventory[variantKey] || 0;\n                    \n                    inventoryList.push({\n                        productId: product.id,\n                        productName: product.name,\n                        color: color.name,\n                        size,\n                        variantKey,\n                        total: quantity,\n                        reserved: 0, // Will be fetched from API\n                        available: quantity\n                    });\n                }\n            }\n        }\n        \n        state.inventory = inventoryList;\n        renderInventoryTable(inventoryList);\n"""
          new = """        // Ask the inventory service for every variant so reserved/available values\n        // match the same reservation rules used by checkout.\n        const data = await fetchAPI('/admin/inventory/low-stock?threshold=2147483647');\n        const inventoryList = (data.lowStock || []).map(item => ({\n            productId: item.productId,\n            productName: item.productName,\n            color: item.color,\n            size: item.size,\n            variantKey: item.variantKey,\n            total: Number(item.total ?? item.quantity ?? 0),\n            reserved: Number(item.reserved || 0),\n            available: Number(item.available ?? item.quantity ?? 0)\n        }));\n        \n        state.inventory = inventoryList;\n        renderInventoryTable(inventoryList);\n"""
          if old not in text:
              raise SystemExit('Could not find expected admin inventory block')
          text = text.replace(old, new, 1)

          # Keep admin calls same-origin through Netlify/Vite instead of bypassing the proxy.
          old_api = """const API_URL = window.location.hostname === 'localhost' \n    ? 'http://localhost:3000/api' \n    : 'https://la-vague-api.onrender.com/api';"""
          if old_api not in text:
              raise SystemExit('Could not find expected admin API URL block')
          text = text.replace(old_api, "const API_URL = '/api';", 1)
          admin.write_text(text)

          # 4) Analytics should rank products from paid orders only.
          routes = Path('src/routes/admin.js')
          text = routes.read_text()
          old = "orders = (await query(`SELECT items FROM orders WHERE created_at > ${interval}`)).rows;"
          new = "orders = (await query(`SELECT items FROM orders WHERE payment_status = 'paid' AND created_at > ${interval}`)).rows;"
          if old not in text:
              raise SystemExit('Could not find expected analytics top-products query')
          routes.write_text(text.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Run quality checks
        run: |
          npm run lint
          npm run type-check

      - name: Run unit tests
        run: npm run test:ci

      - name: Build frontend
        run: npm run build

      - name: Remove one-time workflow
        run: rm .github/workflows/one-time-inventory-visibility-fix.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/products.js src/services/inventory.js src/scripts/admin.js src/routes/admin.js .github/workflows/one-time-inventory-visibility-fix.yml
          git commit -m "fix: show reservation-aware stock across storefront and admin"
          git push origin HEAD:main
